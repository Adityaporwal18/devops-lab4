services:
  blue:
    build:
      context: ..
    environment:
      APP_VERSION: v1

  green:
    build:
      context: ..
    environment:
      APP_VERSION: v2
      SIMULATE_FAILURE: ${GREEN_SIMULATE_FAILURE:-false}

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8087:80"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - blue
      - green
